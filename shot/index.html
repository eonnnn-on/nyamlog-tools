<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 미리보기 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#eef1f6;overflow:hidden}
  iframe{display:block;width:390px;height:660px;border:0;background:#fff}
</style>
</head>
<body>
<script>
var targets = [
  {sel: null, off: 0},
  {sel: '#sec2', off: -8},
  {sel: '#sec3', off: -8},
  {sel: '#sec4', off: -8},
  {sel: '#resultCard', off: -8},
  {sel: '.tips', off: -64}
];
var q = new URLSearchParams(location.search);
var i = Math.max(0, Math.min(targets.length - 1, parseInt(q.get('i') || '0', 10) || 0));
var t = targets[i];
var f = document.createElement('iframe');
f.src = '../tax-calc/';
document.body.appendChild(f);
f.addEventListener('load', function(){
  setTimeout(function(){
    try{
      var doc = f.contentDocument, win = f.contentWindow, y = 0;
      if(t.sel){
        var el = doc.querySelector(t.sel);
        if(el) y = el.getBoundingClientRect().top + win.pageYOffset + t.off;
      }
      win.scrollTo(0, Math.max(0, y));
    }catch(e){}
  }, 300);
});
</script>
</body>
</html>
