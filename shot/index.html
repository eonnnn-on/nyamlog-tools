<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 미리보기 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#e6eaf0;overflow:hidden}
  .row{display:flex;gap:10px;padding:0}
  .phone{width:390px;height:660px;overflow:hidden;background:#fff}
  iframe{display:block;width:390px;height:660px;border:0}
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
var targets = [
  {sel: null, off: 0},
  {sel: '#resultCard', off: -8},
  {sel: '.tips', off: 0}
];
var row = document.getElementById('row');
targets.forEach(function(t){
  var box = document.createElement('div');
  box.className = 'phone';
  var f = document.createElement('iframe');
  f.src = '../tax-calc/';
  box.appendChild(f);
  row.appendChild(box);
  f.addEventListener('load', function(){
    setTimeout(function(){
      try{
        var doc = f.contentDocument, win = f.contentWindow, y = 0;
        var st = doc.createElement('style');
        st.textContent = '::-webkit-scrollbar{width:0;height:0;display:none} html{scrollbar-width:none} body{padding-bottom:calc(480px + env(safe-area-inset-bottom)) !important}';
        doc.head.appendChild(st);
        if(t.sel){
          var el = doc.querySelector(t.sel);
          if(el) y = el.getBoundingClientRect().top + win.pageYOffset + t.off;
        }
        win.scrollTo(0, Math.max(0, y));
      }catch(e){}
    }, 300);
  });
});
</script>
</body>
</html>
